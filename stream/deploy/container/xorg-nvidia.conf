# Headless NVIDIA X screen for one Eleet desktop (/etc/X11/xorg.conf).
# NvFBC captures this screen; the GPU renders the desktop and games on it.
# BusID must match `nvidia-xconfig --query-gpu-info` inside the container.
Section "ServerLayout"
    Identifier "mea"
    Screen 0 "screen0"
    Option "AutoAddDevices" "false"   # input arrives through XTest and uinput
EndSection

Section "Device"
    Identifier "gpu0"
    Driver "nvidia"
    BusID "PCI:49:0:0"
    Option "AllowEmptyInitialConfiguration" "true"
    Option "ConnectedMonitor" "DFP-0"
    Option "HardDPMS" "false"
EndSection

Section "Screen"
    Identifier "screen0"
    Device "gpu0"
    DefaultDepth 24
    Option "ModeValidation" "NoMaxPClkCheck,NoEdidMaxPClkCheck,NoMaxSizeCheck,NoHorizSyncCheck,NoVertRefreshCheck,NoVirtualSizeCheck,NoExtendedGpuCapabilitiesCheck,NoTotalSizeCheck,NoDualLinkDVICheck,NoDisplayPortBandwidthCheck,AllowNon3DVisionModes,AllowNonHDMI3DModes,AllowNonEdidModes,NoEdidHDMI2Check,AllowDpInterlaced"
    SubSection "Display"
        Depth 24
        Virtual 1920 1080
        Modes "1920x1080" "1600x900" "1280x720"
    EndSubSection
EndSection
